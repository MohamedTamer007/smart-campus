name: Real worker inference
on:
  pull_request:
    paths: ['worker/**', '.github/workflows/worker-inference.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-inference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build actual CPU inference environment
        run: docker build -f worker/Dockerfile -t smart-campus-worker:ci .
      - name: Exercise pinned model through loopback HTTP
        run: |
          mkdir -p "$RUNNER_TEMP/siglip-cache" test-results
          sudo chown 1654:1654 "$RUNNER_TEMP/siglip-cache"
          docker run --rm --network host --memory 6g --cpus 2 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --mount "type=bind,source=$RUNNER_TEMP/siglip-cache,target=/var/lib/smart-campus/model-cache" \
            --entrypoint python smart-campus-worker:ci verify_inference.py > test-results/real-worker.json
          cat test-results/real-worker.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: real-worker-${{ github.sha }}
          path: test-results/real-worker.json
          retention-days: 7
