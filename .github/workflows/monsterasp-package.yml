name: MonsterASP.NET Windows publish package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/monsterasp-package.yml'
      - 'backend/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'scripts/publish.ps1'

# This builds an inert ZIP artifact. It never authenticates to or deploys to a hosting account.
permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Build combined React and ASP.NET Core publish output
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -Destination "$env:RUNNER_TEMP/monsterasp-publish"
      - name: Verify IIS entrypoint, SPA and secret exclusions
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'monsterasp-publish'
          foreach ($required in @('web.config', 'SmartCampus.Api.dll', 'wwwroot/index.html')) {
            if (-not (Test-Path (Join-Path $root $required))) {
              throw "Required publish file missing: $required"
            }
          }
          $unsafe = @(Get-ChildItem -Path $root -File -Recurse | Where-Object {
            $_.Name -in @('appsettings.Local.json', '.env') -or $_.Extension -in @('.pfx', '.pem', '.key')
          })
          if ($unsafe.Count -ne 0) {
            throw 'Potential private configuration or key material in publish output.'
          }
          $config = Get-Content (Join-Path $root 'web.config') -Raw
          if ($config -notmatch 'AspNetCoreModuleV2') {
            throw 'IIS ASP.NET Core hosting module entrypoint missing.'
          }
      - name: Upload package for controlled deployment
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: monsterasp-windows-publish-${{ github.sha }}
          path: ${{ runner.temp }}/monsterasp-publish/
          if-no-files-found: error
          retention-days: 7
