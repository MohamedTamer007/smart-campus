services:
  api:
    image: ${API_IMAGE:?Set the verified API image identity}
    network_mode: host
    env_file: ${API_ENV_FILE:?Set the private API environment file}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:8080
      ReverseProxy__KnownProxy: 127.0.0.1
    volumes:
      - /var/lib/smart-campus/keys:/var/lib/smart-campus/keys
      - /etc/smart-campus/data-protection.pfx:/run/secrets/data-protection.pfx:ro
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  worker:
    image: ${WORKER_IMAGE:?Set the verified worker image identity}
    network_mode: host
    env_file: ${WORKER_ENV_FILE:?Set the private worker environment file}
    volumes:
      - /var/lib/smart-campus/model-cache:/var/lib/smart-campus/model-cache
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 8g
    cpus: 1
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8123/health", timeout=5).read()']
      interval: 30s
      timeout: 6s
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  proxy:
    image: caddy:2.11.9-alpine
    network_mode: host
    environment:
      CAMPUS_HOST: ${CAMPUS_HOST:?Set the authorized free HTTPS hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/smart-campus/caddy-data:/data
      - /var/lib/smart-campus/caddy-config:/config
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
